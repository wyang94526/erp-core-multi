# Production stack — Linux containers, any Docker host.
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_CORE_DB}
    volumes:
      - erp_core_prod_postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_CORE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_CORE_DB}
      ENVIRONMENT: production
      AI_CHROMA_PATH: /data/chroma
      ATTACHMENTS_PATH: /data/attachments
      GTT_DATA_DIR: /data/imports
      GTT_IMPORT_HOST_PATH: ${GTT_IMPORT_HOST_PATH:-C:/erp/erp-core-multi/imports}
    volumes:
      - erp_core_prod_chroma_data:/data/chroma
      - erp_core_prod_attachments_data:/data/attachments
      - ${GTT_IMPORTS_BIND:-./imports}:/data/imports
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: erp-frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  erp_core_prod_postgres_data:
  erp_core_prod_chroma_data:
  erp_core_prod_attachments_data:
